# Nginx server block for bileton.kz (phase 1 static site).
#
# Path assumption: the site files live at /var/www/bileton on the VPS.
# Adjust `root` below if you deploy somewhere else.
#
# Install:
#   sudo cp nginx-bileton.conf /etc/nginx/sites-available/bileton.kz
#   sudo ln -s /etc/nginx/sites-available/bileton.kz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (this rewrites the file to add the SSL
# server block and the 80->443 redirect automatically):
#   sudo certbot --nginx -d bileton.kz -d www.bileton.kz

server {
    listen 80;
    listen [::]:80;
    server_name bileton.kz www.bileton.kz;

    root /var/www/bileton;
    index index.html;

    # gzip for text-based assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # long cache for fingerprint-free static assets, short cache for the
    # HTML shell so copy/translation fixes go live without a hard refresh
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
